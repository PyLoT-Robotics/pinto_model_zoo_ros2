services:
  wholebody_detector:
    image: pinto_model_zoo_ros2:humble
    build:
      context: .
      dockerfile: docker/Dockerfile
    gpus: all
    network_mode: host
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
    command:
      - ros2
      - run
      - pinto_model_zoo_ros2
      - wholebody_detector
      - --ros-args
      - -r
      - image:=${IMAGE_TOPIC:-/camera/color/image_raw}
      - -p
      - "model_variant:='${MODEL_VARIANT:-s}'"

  person_tracker:
    image: pinto_model_zoo_ros2:humble
    profiles: ["person_tracker"]
    gpus: all
    network_mode: host
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
    command:
      - ros2
      - run
      - pinto_model_zoo_ros2
      - person_tracker
      - --ros-args
      - -r
      - image:=${COLOR_TOPIC:-/d455/camera/color/image_raw}
      - -r
      - depth:=${DEPTH_TOPIC:-/d455/camera/aligned_depth_to_color/image_raw}
      - -r
      - camera_info:=${CAMERA_INFO_TOPIC:-/d455/camera/color/camera_info}

  face_recognizer:
    image: pinto_model_zoo_ros2:humble
    profiles: ["face_recognizer"]
    gpus: all
    network_mode: host
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
    volumes:
      - ${FACE_GALLERY_DIR:-${HOME}/pylot_robocup/face_images}:/faces:ro
    command:
      - ros2
      - run
      - pinto_model_zoo_ros2
      - face_recognizer
      - --ros-args
      - -r
      - image:=${COLOR_TOPIC:-/d455/camera/color/image_raw}
      - -p
      - gallery_directory:=/faces
